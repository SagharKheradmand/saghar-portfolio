name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "24"
          cache: true
          run-install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec playwright install --with-deps --no-shell chromium
      - run: pnpm test
      - run: pnpm build
